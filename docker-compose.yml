services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      USE_LOCAL_YOLO: "true"
      USE_PLACEHOLDERS: "false"
      WORKER_URL: http://worker:8001
      UPLOADS_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./data/uploads:/data/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./workers
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      UPLOADS_DIR: /data/uploads
      YOLO_MODEL_PATH: models/yolov8n.pt
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./workers:/app
      - ./data/uploads:/data/uploads
    command: uvicorn app.http_server:app --host 0.0.0.0 --port 8001 --reload

  admin:
    build: ./apps/admin
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_ADMIN_SECRET: placeholder-admin-secret
    depends_on:
      - backend

volumes:
  pgdata:
