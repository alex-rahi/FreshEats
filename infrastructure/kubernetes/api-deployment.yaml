apiVersion: v1
kind: ServiceAccount
metadata:
  name: fresheats-api
  namespace: fresheats
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/fresheats-api-irsa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fresheats-api
  namespace: fresheats
  labels:
    app: fresheats-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fresheats-api
  template:
    metadata:
      labels:
        app: fresheats-api
    spec:
      serviceAccountName: fresheats-api
      containers:
        - name: api
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/fresheats-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fresheats-config
            - secretRef:
                name: fresheats-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fresheats-api
  namespace: fresheats
spec:
  selector:
    app: fresheats-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fresheats-api-hpa
  namespace: fresheats
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fresheats-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
