apiVersion: v1
kind: ServiceAccount
metadata:
  name: fresheats-api
  namespace: fresheats
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::339961047023:role/fresheats-api-irsa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fresheats-api
  namespace: fresheats
  labels:
    app: fresheats-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fresheats-api
  template:
    metadata:
      labels:
        app: fresheats-api
    spec:
      serviceAccountName: fresheats-api
      containers:
        - name: api
          image: 339961047023.dkr.ecr.us-east-1.amazonaws.com/fresheats-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fresheats-config
            - secretRef:
                name: fresheats-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fresheats-api
  namespace: fresheats
spec:
  selector:
    app: fresheats-api
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
---
# HPA disabled for Free Tier single-node beta (maxReplicas would fight the 1-node cap).
