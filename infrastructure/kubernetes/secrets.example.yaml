# Copy to secrets.yaml and fill from Terraform / Secrets Manager.
# Never commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: plate-secrets
  namespace: plate
type: Opaque
stringData:
  DATABASE_URL: "postgresql://plate:CHANGE_ME@plate-postgres.xxxxx.us-east-1.rds.amazonaws.com:5432/plate"
  ADMIN_SECRET: "CHANGE_ME"
  COGNITO_USER_POOL_ID: "us-east-1_XXXX"
  COGNITO_CLIENT_ID: "xxxxxxxxxxxx"
  COGNITO_ISSUER: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXX"
  SQS_MODERATION_URL: "https://sqs.us-east-1.amazonaws.com/123456789012/plate-moderation"
  CLOUDFRONT_DOMAIN: "dxxxxx.cloudfront.net"
  REDIS_URL: "redis://plate-redis.xxxxx.cache.amazonaws.com:6379"
  NEXT_PUBLIC_ADMIN_SECRET: "CHANGE_ME"
