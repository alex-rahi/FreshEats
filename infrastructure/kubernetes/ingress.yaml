apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fresheats-ingress
  namespace: fresheats
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - api.fresheats.app
        - admin.fresheats.app
      secretName: fresheats-tls
  rules:
    - host: api.fresheats.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fresheats-api
                port:
                  number: 80
    - host: admin.fresheats.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fresheats-admin
                port:
                  number: 80
