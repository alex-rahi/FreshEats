apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plate-ingress
  namespace: plate
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - api.plate.app
        - admin.plate.app
      secretName: plate-tls
  rules:
    - host: api.plate.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plate-api
                port:
                  number: 80
    - host: admin.plate.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plate-admin
                port:
                  number: 80
