apiVersion: apps/v1
kind: Deployment
metadata:
  name: plate-admin
  namespace: plate
  labels:
    app: plate-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: plate-admin
  template:
    metadata:
      labels:
        app: plate-admin
    spec:
      containers:
        - name: admin
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/plate-admin:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: plate-config
            - secretRef:
                name: plate-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: plate-admin
  namespace: plate
spec:
  selector:
    app: plate-admin
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
