apiVersion: v1
kind: ServiceAccount
metadata:
  name: fresheats-worker
  namespace: fresheats
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::339961047023:role/fresheats-worker-irsa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fresheats-worker
  namespace: fresheats
  labels:
    app: fresheats-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fresheats-worker
  template:
    metadata:
      labels:
        app: fresheats-worker
    spec:
      serviceAccountName: fresheats-worker
      containers:
        - name: worker
          image: 339961047023.dkr.ecr.us-east-1.amazonaws.com/fresheats-worker:latest
          command: ["python", "-m", "app.sqs_consumer"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: fresheats-config
            - secretRef:
                name: fresheats-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: fresheats-worker
  namespace: fresheats
spec:
  selector:
    app: fresheats-worker
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
